[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsa-cash-reconciliation-control-tower"
version = "0.1.0"
description = "Controlled, exception-based cash reconciliation prototype"
requires-python = ">=3.10"
dependencies = [
  "msal>=1.28,<2",
  "openpyxl>=3.1,<4",
  "pandas>=2.1,<4",
  "PyYAML>=6.0,<7",
  "requests>=2.31,<3",
  "streamlit>=1.32,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
