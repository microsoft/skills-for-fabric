name: Bug / Error
description: Report an error, failure, or unexpected behavior when using Fabric Skills
title: "[Bug]: "
labels: ["bug"]
body:

  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue with **Fabric Skills**.
        High-quality reports with **full CLI traces** help us diagnose and fix issues faster.

  - type: dropdown
    id: owner
    attributes:
      label: Owner area / team
      description: |
        Which Fabric area or team should handle this? Pick the closest match.
        If you are not sure, choose the last option (the general / infrastructure bucket).
        A bot applies the matching `area:*` label so the right team is notified.
      options:
        - Databricks migration
        - Synapse / pipeline migration
        - HDInsight migration
        - Data engineering (Spark / lakehouse / notebooks)
        - SQL Data Warehouse
        - SQL database
        - Dataflows Gen2
        - Eventhouse / KQL
        - Event Schema Set / Real-Time Intelligence
        - Eventstream / Real-Time Intelligence
        - Activator / Reflex
        - OneLake Catalog (search / discovery / governance)
        - Power BI semantic models
        - Ananke / FabricIQ (Power BI data exploration)
        - Power BI Reports
        - Fabric IQ / Ontology
        - Fabric CI/CD
        - Azure Monitor into Fabric
        - Fabric cost estimation
        - Infrastructure / repo / CI / general (or not sure)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: |
        Clearly describe the problem. Include:
        - What you were trying to do
        - What you expected to happen
        - What actually happened
      placeholder: |
        The command failed when creating a workspace using Fabric Skills...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Provide exact step-by-step instructions so we can reliably reproduce the issue.
      placeholder: |
        1. Open PowerShell 7
        2. Run `copilot`
        3. Execute Fabric Skills command ...
        4. Observe error ...
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Full error output
      description: |
        Paste the **complete** error message exactly as shown.
        Do not paraphrase or truncate.
      render: shell
    validations:
      required: true

  - type: textarea
    id: trace
    attributes:
      label: AI tool execution trace
      description: |
        Paste the **full execution trace** from the failing command (for example, the
        Copilot CLI trace). This is critical for debugging skill routing and execution flow.

        Do not redact or summarize the trace unless it contains secrets or tokens.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: affected_skill
    attributes:
      label: Affected skill(s)
      description: Which Fabric Skills skill(s) does this affect, if known?
      placeholder: "e.g. sqldw-cli, spark-authoring-cli"
    validations:
      required: false

  - type: input
    id: skills
    attributes:
      label: Fabric Skills version
      description: Check `package.json`, or the version field in the installed plugin manifest.
      placeholder: "e.g. 1.2.0"
    validations:
      required: true

  - type: dropdown
    id: ai_tool
    attributes:
      label: AI tool used
      description: Which AI coding tool were you using?
      options:
        - GitHub Copilot CLI
        - VS Code Copilot
        - Claude Code
        - Cursor
        - Windsurf
        - Codex / Jules
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other relevant information (screenshots, workarounds tried, etc.)
      placeholder: Optional - add anything else that might help.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I selected the correct owner area above
          required: true
        - label: This issue does **not** contain secrets, tokens, or credentials
          required: true
