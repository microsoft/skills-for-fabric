name: skills-for-fabric
version: 0.3.17
description: Microsoft Fabric skills for AI coding agents, with shared reference material.
author: Microsoft Fabric
license: MIT

# Explicit consent to deploy this package's local content.
includes: auto

# APM resolves MCP dependencies only from this root manifest, so every
# server the collection can need is declared here.
dependencies:
  mcp:
    - name: FabricIQ
      registry: false
      transport: http
      url: https://fabriciq.svc.cloud.microsoft/v1/mcp/fabriciq
      headers:
        X-VARIANTS: "Fabric.Routing.FabricIQ.V1"
      tools:
        - "*"
    - name: fabric-sqlendpoint
      registry: false
      transport: http
      url: https://api.fabric.microsoft.com/v1/mcp/dataPlane/sqlEndpoint
      tools:
        - "execute_query"
    - name: powerbi-modeling-mcp
      registry: false
      transport: stdio
      command: npx
      args: ["-y", "@microsoft/powerbi-modeling-mcp@latest", "--start"]
      tools:
        - "*"
